<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>LiftLog</title>
<meta name="theme-color" content="#191b1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;700;800&display=swap">
<style>
/* Layout: one-column phone coach. Sticky header, bottom tabs; the workout screen shows one set at a time with big numbers you can read at arm's length.
   Palette: bumper-plate colors carry meaning. Blue (20 kg plate) = act, green = progress, yellow = hold steady, red = back off. Neutrals are cool steel and rubber-floor graphite. */
:root{
  --bg:#edf0f3;--surface:#ffffff;--surface2:#e2e7ec;--fg:#14181c;--muted:#55606b;--line:#d2d9e0;
  --accent:#1f56d0;--on-accent:#ffffff;--chart:#1f56d0;
  --plate-green:#1d7a44;--plate-yellow:#efc21a;--plate-red:#c8352a;--on-yellow:#1a1606;
  --done:#ddf0e4;--done-fg:#17703f;--on-done:#ffffff;--warn:#7a5a00;--warn-bg:#fbf0c7;--danger:#b3302a;--scrim:rgba(20,24,28,.45);
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191b1e;--surface:#222529;--surface2:#2d3136;--fg:#edf0f3;--muted:#9aa4ae;--line:#353a41;
  --accent:#5b8cff;--on-accent:#0a1430;--chart:#5b8cff;
  --done:#183322;--done-fg:#61d391;--on-done:#08170e;--warn:#f3cd4b;--warn-bg:#352d10;--danger:#ff8a7c;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191b1e;--surface:#222529;--surface2:#2d3136;--fg:#edf0f3;--muted:#9aa4ae;--line:#353a41;
  --accent:#5b8cff;--on-accent:#0a1430;--chart:#5b8cff;
  --done:#183322;--done-fg:#61d391;--on-done:#08170e;--warn:#f3cd4b;--warn-bg:#352d10;--danger:#ff8a7c;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.resting{padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5;padding-block:14px 10px}
header .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1,h3,.fname{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1;min-width:0;flex:1}
h3{font-size:24px;line-height:1.1}
h2{font-size:15px;color:var(--muted);font-weight:700;margin:14px 0 -2px}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.saved::before{content:"● ";color:var(--done-fg)}
.mic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.mic.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mic svg{width:18px;height:18px}
main{padding-block:14px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav .in{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;border:0;border-top:3px solid transparent;color:var(--muted);padding:14px 0 16px;font:600 14px var(--font-body);cursor:pointer}
nav button.on{color:var(--fg);border-top-color:var(--accent)}
.card{background:var(--surface);border-radius:14px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.card.warn{background:var(--warn-bg);border-color:transparent}
.btn{background:var(--surface2);color:var(--fg);border:0;border-radius:10px;padding:11px 14px;font:600 15px var(--font-body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.dangerfill{background:var(--danger);color:var(--surface)}
.btn.block{width:100%;display:block}
.btn.big{padding:17px;font-size:17px}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,svg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 10px;font:16px var(--font-body);width:100%}
select.inline{width:auto;padding:6px 8px;font-size:14px}
textarea{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
label{display:block}
label>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:flex;gap:8px}
.stats>div{flex:1;min-width:0}
.stats strong{font:800 24px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi strong{display:block;font:800 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:13px 12px;font:15px var(--font-body);cursor:pointer}
.item:last-child{border-bottom:0}
.item.off{opacity:.55}
.exline{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.exline:first-child{border-top:0}
.exline>span:first-child{min-width:0}
.exline>span:last-child{white-space:nowrap;text-align:right}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);vertical-align:1px;white-space:nowrap}
.pill.pr{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--font-body);cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* coach notes: the tag color encodes the kind of change */
.tag{display:inline-block;font:800 17px/1.2 var(--font-display);padding:2px 9px;border-radius:4px;white-space:nowrap}
.tag.up{background:var(--plate-green);color:#fff}
.tag.reps,.tag.new{background:var(--accent);color:var(--on-accent)}
.tag.same{background:var(--plate-yellow);color:var(--on-yellow)}
.tag.down{background:var(--plate-red);color:#fff}
.note{display:flex;flex-direction:column;gap:4px}
.note p{margin:0;font-size:14px;color:var(--muted)}
.plan{display:flex;flex-direction:column}
.plan>div{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.plan>div:first-child{border-top:0;padding-top:0}
.plan .nm{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:600}
.plan .nm span:last-child{white-space:nowrap}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px;min-width:0}
.wd.today{background:var(--surface2)}
.wd b{font-size:12px;color:var(--muted)}
.wd i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px dashed var(--line);color:var(--muted)}
.wd.done i{background:var(--done-fg);color:var(--on-done);border:0}
.wd.planned i{border:2px solid var(--accent);color:var(--fg)}
.wd.missed i{border:1.5px solid var(--muted);color:var(--muted)}
.wd small{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
/* recovery map */
.body-map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
.body-map svg{width:100%;max-width:220px;height:auto}
.body-map .neutral{fill:var(--surface2)}
.body-map text{fill:var(--muted);font:11px var(--font-body)}
.rlist{display:flex;flex-direction:column;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.rlist div{display:grid;grid-template-columns:70px 1fr 38px;gap:6px;align-items:center}
.rbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.rbar span{display:block;height:100%;background:var(--done-fg);border-radius:3px}
/* focus mode */
.eyebrow{font-size:14px;color:var(--muted);font-weight:700}
.fname{font-size:36px;line-height:1}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.step{width:58px;height:58px;flex:none;border-radius:50%;border:0;background:var(--surface2);color:var(--fg);font:700 30px var(--font-display);cursor:pointer}
.fv{flex:1;min-width:0;text-align:center}
.fv input{font:800 52px/1.05 var(--font-display);text-align:center;background:transparent;border:0;padding:0;width:100%;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.fv input::-webkit-outer-spin-button,.fv input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fv span{display:block;font-size:14px;color:var(--muted)}
.bigbtn{width:100%;min-height:78px;font:800 30px var(--font-display);letter-spacing:.01em;border-radius:14px;background:var(--accent);color:var(--on-accent);border:0;cursor:pointer}
.sets-strip{display:flex;gap:6px;flex-wrap:wrap}
.dot{padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.dot.done{background:var(--done);color:var(--done-fg);font-weight:600}
.dot.cur{background:var(--fg);color:var(--bg);font-weight:700}
.timer{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.ring{--p:100;--rc:var(--accent);width:230px;height:230px;max-width:72vw;max-height:72vw;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center}
.ring>div{width:86%;height:86%;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;align-content:center;gap:2px}
.ring.hold{--rc:var(--plate-yellow)}
.ring.emom{--rc:var(--plate-green)}
.ring strong{font:800 84px/.95 var(--font-display);font-variant-numeric:tabular-nums}
.ring .word{font:800 30px var(--font-display)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg.five{grid-template-columns:repeat(5,1fr)}
.seg button{padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--font-body);cursor:pointer}
.seg.five button{padding:10px 2px;font-size:14px}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.check{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 15px var(--font-body);width:100%;text-align:left;cursor:pointer}
.check .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.check.on .box{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal{z-index:25}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#pickList{overflow:auto;flex:1}
#mini{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--surface2);border-top:1px solid var(--line);overflow:hidden}
#mini .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.16;transition:width .3s linear}
#mini .in{position:relative;max-width:640px;margin:0 auto;padding-block:8px}
#miniTxt{font:800 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-220%);visibility:hidden;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;transition:transform .25s,visibility .25s;max-width:calc(100% - 32px)}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.ritem{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0}
.ritem .nm{flex:1;min-width:0;font-size:14px}
.mini-step{width:34px;height:34px;border-radius:8px;border:0;background:var(--surface2);color:var(--fg);font-size:18px;cursor:pointer;flex:none}
.x{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:6px;flex:none}
/* charts */
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:11px var(--font-body)}
.chart .line{fill:none;stroke:var(--chart);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--chart);opacity:.12}
.chart .endpt,.chart .hdot{fill:var(--chart);stroke:var(--surface);stroke-width:2}
.chart .vlabel{fill:var(--fg);font:600 12px var(--font-body)}
.chart .xhair{stroke:var(--muted);stroke-width:1}
.chart .bar{fill:var(--chart)}
.chart .bar.hot{opacity:.75}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;top:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translateX(-50%);z-index:2}
.tip strong{display:block;font-size:14px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
table.tv{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
.tv td,.tv th{text-align:left;padding:4px 0;border-bottom:1px solid var(--line)}
.tv td:last-child,.tv th:last-child{text-align:right}
.platevis{display:flex;align-items:center;justify-content:center;gap:3px;padding:12px 0;min-height:130px;overflow-x:auto}
.platevis .barend{width:46px;height:10px;background:var(--muted);border-radius:3px}
.platevis .collar{width:8px;height:26px;background:var(--muted);border-radius:2px}
.platevis .pl{width:18px;border-radius:4px;background:var(--fg);display:flex;align-items:flex-end;justify-content:center}
.platevis .pl.c-red{background:var(--plate-red)}.platevis .pl.c-blue{background:#1f56d0}.platevis .pl.c-yellow{background:var(--plate-yellow)}.platevis .pl.c-green{background:var(--plate-green)}
.platevis .pl.c-yellow span{color:var(--on-yellow)}.platevis .pl.c-red span,.platevis .pl.c-blue span,.platevis .pl.c-green span{color:#fff}
.platevis .pl span{font-size:11px;color:var(--bg);font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);padding:4px 0}
/* setup */
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:15px var(--font-body);cursor:pointer}
.opt span{color:var(--muted);font-size:13px}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);transition:width .3s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dayname{font:800 24px var(--font-display);background:transparent!important;border:1px solid transparent!important;padding:4px 6px!important;border-radius:8px;color:var(--fg)}
.dayname:focus{border-color:var(--line)!important}
.ritem2{border-top:1px solid var(--line)}
.ritem2:first-child{border-top:0}
.rhead{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;color:var(--fg);text-align:left;padding:10px 0;font:15px var(--font-body);cursor:pointer}
.rhead strong{font-weight:700}
.rhead[aria-expanded="true"] strong{color:var(--accent)}
.rhead .muted::after{content:" · Edit";color:var(--accent)}
.rhead[aria-expanded="true"] .muted::after{content:" · Close"}
.ied{display:flex;flex-direction:column;gap:10px;padding:2px 0 12px}
.x:disabled{opacity:.3;cursor:default}
.mynote{background:var(--warn-bg);border-radius:12px;padding:10px 12px;font-size:15px}
.hero{display:flex;flex-direction:column;gap:14px;padding-block:18px 6px}
.hero h2{font:800 50px/.95 var(--font-display);text-transform:none;color:var(--fg);margin:0;text-wrap:balance}
.hero ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.hero li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:15px}
.hero li b{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 17px var(--font-display)}
p{margin:0}
@media (prefers-reduced-motion:reduce){#toast,#mini .fill{transition:none}}
</style>

<header class="gut"><div class="in"><h1 id="title">LiftLog</h1><button class="mic" id="micBtn" data-a="mic" aria-label="Voice commands" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><span class="badge saved" id="hdr">Saved on this device</span></div></header>
<main class="gut"></main>
<div id="mini" hidden><div class="fill" id="miniFill"></div><div class="in row gut"><span class="muted">Rest</span><strong id="miniTxt">0:00</strong><span class="grow"></span><button class="btn sm" data-a="restAdj" data-v="-15">−15s</button><button class="btn sm" data-a="restAdj" data-v="15">+15s</button><button class="btn sm primary" data-a="restSkip">Skip</button></div></div>
<nav class="gut"><div class="in">
  <button data-a="tab" data-v="workout">Workout</button>
  <button data-a="tab" data-v="history">History</button>
  <button data-a="tab" data-v="exercises">Exercises</button>
  <button data-a="tab" data-v="settings">Settings</button>
</div></nav>
<div id="dialog" class="overlay" hidden></div>
<div id="modal" class="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json,.txt" hidden>

<script>
"use strict";
/* ================= data ================= */
const KEY='liftlog.v2',OLD_KEY='liftlog.v1';
// name, muscle, equipment, movement pattern, type, repMin, repMax, rest seconds, increment (lb), target (reps, seconds or meters)
const CATALOG=[
 ['Bench Press (Barbell)','Chest','barbell','h-push','weight',6,10,150,5],
 ['Dumbbell Bench Press','Chest','dumbbell','h-push','weight',8,12,90,5],

function syncTypeFields(){const t=$('#e-type')?.value;if(!t)return;

let openItem={ctx:null,i:-1},itemTarget=null;

function makeEntry(exId,rec,from,ov){return {exId,rec,ov:ov||{},from:from||null,feel:null,form:false,sets:Array.from({length:Math.max(1,rec.sets||3)},()=>({w:rec.w??'',r:rec.r??'',t:rec.t??'',d:rec.d??'',done:false}))}}

  S.active={id:uid(),name,routineId:routineId||null,deload:deloadActive(),start:Date.now(),exercises:entries,cur:{ei:0,si:0},phase:'set',restEnd:0,restTotal:0,hold:null,emom:null,tempo:null,log:[],checkin:{}};

function startRest(sec){const A=S.active;lastBeep=-1;if(!sec){A.restEnd=0;return}A.restTotal=sec;A.restEnd=Date.now()+sec*1000}
function firstOpen(x){return x.sets.findIndex(s=>!s.done)}
function advance(){
  const A=S.active,n=A.exercises.length;
  for(let k=1;k<=n;k++){const ei=(A.cur.ei+k)%n,si=firstOpen(A.exercises[ei]);if(si>=0){A.cur={ei,si};A.phase='set';return}}

function complete(){
  const {A,x,ex,s}=curParts();if(!s)return;
  if((ex.type==='weight'||ex.type==='reps')&&!(+s.r>0)){toast('Enter your reps, then tap Done');return}
  if(ex.type==='distance'&&!(+s.d>0)){toast('Enter the distance, then tap Done');return}
  if(s.w==='')s.w=0;
  s.w=+s.w||0;s.r=+s.r||0;s.t=+s.t||0;s.d=+s.d||0;s.done=true;A.log.push([A.cur.ei,A.cur.si]);

}

function emomRound(){const E=S.active?.emom;if(!E)return 0;return Math.max(0,Math.floor((Date.now()-E.start)/1000/E.interval))}
function emomDone(n){
  const {A,x,ex}=curParts(),E=A.emom;A.emom=null;

/* ================= timers ================= */
function tick(){
  const A=S.active,hdr=$('#hdr'),mini=$('#mini');
  if(A){hdr.classList.remove('saved');hdr.textContent=clock((Date.now()-A.start)/1000)}else{hdr.classList.add('saved');hdr.textContent='Saved on this device'}
  if(!A){mini.hidden=true;document.body.classList.remove('resting');return}
  const now=Date.now(),ring=$('#ring');
  if(A.restEnd){
    const left=A.restEnd-now;
    if(left<=0){A.restEnd=0;save();buzz([250,120,250]);beep(880,.6);const n=nextUpText();if(n&&A.phase==='rest')speak(n.speech);
      if(A.phase==='rest'){A.phase='set';render();return}}
    else{const secs=Math.ceil(left/1000),pct=Math.min(100,left/(A.restTotal*1000)*100);
      if(secs<=3&&secs!==lastBeep){lastBeep=secs;beep(660,.12,.2)}
      const big=$('#restBig');if(big){big.textContent=clock(secs);ring.style.setProperty('--p',pct)}
      $('#miniTxt').textContent=clock(secs);$('#miniFill').style.width=pct+'%'}
  }
  const showMini=!!A.restEnd&&A.phase!=='rest';mini.hidden=!showMini;document.body.classList.toggle('resting',showMini);
  const ready=(start,big,lbl)=>{const n=Math.ceil((start-now)/1000);if(big)big.textContent=n;if(lbl)lbl.textContent='Get ready';if(ring)ring.style.setProperty('--p',100);if(n!==lastBeep){lastBeep=n;beep(660,.12,.2)}};
  if(A.phase==='hold'&&A.hold){
    const big=$('#holdBig'),lbl=$('#holdLbl');
    if(now<A.hold.start)ready(A.hold.start,big,lbl);
    else{const left=A.hold.target-(now-A.hold.start)/1000;
      if(lastBeep!=='go'){lastBeep='go';beep(990,.3)}
      if(left<=0){holdDone(A.hold.target);return}
      if(big){big.textContent=Math.ceil(left);lbl.textContent='seconds left';ring.style.setProperty('--p',left/A.hold.target*100)}}
  }
  if(A.phase==='emom'&&A.emom){
    const E=A.emom,big=$('#emBig'),lbl=$('#emRound');
    if(now<E.start){const n=Math.ceil((E.start-now)/1000);if(big)big.textContent=clock(n);if(n!==lastBeep){lastBeep=n;beep(660,.12,.2)}}
    else{const el=(now-E.start)/1000,round=Math.floor(el/E.interval),left=E.interval-el%E.interval;
      if(round>=E.rounds){emomDone(E.rounds);return}
      if(round!==E.lastRound){E.lastRound=round;beep(990,.35);buzz(200);speak(`Round ${round+1}. ${E.r} reps.`);save();render();return}
      const secs=Math.ceil(left);if(secs<=3&&`e${round}-${secs}`!==lastBeep){lastBeep=`e${round}-${secs}`;beep(660,.12,.2)}
      if(big){big.textContent=clock(secs);lbl.textContent=`Round ${round+1} of ${E.rounds}`;ring.style.setProperty('--p',left/E.interval*100)}}
  }
  if(A.phase==='tempo'&&A.tempo){
    const T=A.tempo,big=$('#tpBig'),word=$('#tpWord'),rep=$('#tpRep');
    if(now<T.start)ready(T.start,big,null);
    else{const L=T.d+T.p+T.u,el=(now-T.start)/1000,n=Math.floor(el/L);
      if(n>=T.reps){tempoDone(T.reps,true);return}
      const w=el%L;let ph,left;if(w<T.d){ph='Lower';left=T.d-w}else if(w<T.d+T.p){ph='Pause';left=T.d+T.p-w}else{ph='Lift';left=L-w}
      const key=`t${n}-${ph}`;if(key!==lastBeep){lastBeep=key;beep(ph==='Lower'?440:ph==='Pause'?560:880,.15,.25)}
      if(big){big.textContent=Math.ceil(left);word.textContent=ph;rep.textContent=`Rep ${n+1} of ${T.reps}`;ring.style.setProperty('--p',100-w/L*100)}}
  }
}
function holdDone(secs){const A=S.active,{s}=curParts();A.hold=null;s.t=secs;beep(880,.6);buzz([250,120,250]);complete()}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recog=null,listening=false;

function startListening(){
  if(!SR){toast('This browser doesn’t support voice commands');return}
  try{recog=new SR();recog.lang=navigator.language||'en-US';recog.continuous=true;recog.interimResults=false;
    recog.onresult=e=>{const r=e.results[e.results.length-1];if(r.isFinal)handleVoice(r[0].transcript.toLowerCase().trim())};
    recog.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){stopListening();toast('Microphone access was refused')}else if(e.error==='network'){stopListening();toast('Voice commands need an internet connection on this device')}};
    recog.onend=()=>{if(listening)try{recog.start()}catch(e){}};

function handleVoice(t){
  const A=S.active;if(!A)return;toast(`Heard: “${t}”`);
  const say=m=>speak(m,true),num=t.match(/(\d+(?:\.\d+)?)/),{x,ex,s}=curParts();
  if(/what'?s next|what now|next set|what do i do/.test(t)){const n=nextUpText();say(A.phase==='rate'?'Rate this exercise: easy, good, or hard.':n?n.speech:'Check in and save your workout.');return}
  if(/undo/.test(t)){act.undo();return}
  if(/swap/.test(t)&&A.phase==='set'){swapSheet();return}
  if(A.phase==='rest'&&/skip|ready|start set|let'?s go|go/.test(t)){act.restSkip();say('Go.');return}
  if(A.phase==='rate'){const f=t.match(/\b(easy|good|hard)\b/);if(f){x.feel=f[1];save();render();say(`${f[1]}. Say next when you're ready.`);return}if(/next|continue|done/.test(t)){act.nextEx();return}}
  if(A.phase==='checkin'&&/done|save|finish/.test(t)){act.finish();return}
  if(A.phase==='set'&&s){
    if(num&&/(pound|lb|kilo|kg)/.test(t)){s.w=+num[1];save();render();say(`${num[1]} ${unitWord()}.`);return}
    if(num&&/rep/.test(t)){s.r=+num[1];save();render();say(`${num[1]} reps.`);return}
    if(/heavier|more weight|add weight/.test(t)){act.step({dataset:{f:'w',d:'1'}});say(`${fmtW(+curParts().s.w)}.`);return}
    if(/lighter|less weight|take off/.test(t)){act.step({dataset:{f:'w',d:'-1'}});say(`${fmtW(+curParts().s.w)}.`);return}
    if(/start (the )?rest|rest now/.test(t)){startRest(ex.rest);A.phase='rest';save();render();return}
    if(/done|finished|complete|got it|start/.test(t)){const a=ex.type==='time'?'holdStart':ex.type==='emom'?'emomStart':'complete';act[a]();return}
  }
  if(/stop/.test(t)){if(A.phase==='hold')act.holdStop();else if(A.phase==='tempo')act.tempoStop();else if(A.phase==='emom')act.emomEnd();return}
}

function pickFor(slot,used,su){

function buildPlan(su,keys){

    slots.forEach((slot,i)=>{const e=pickFor(slot,used,su);if(!e)return;used.add(e.id);const main=i<2;
      items.push({exId:e.id,sets:su.level==='new'?(main?3:2):su.level==='exp'&&main?4:3})});

  undo:()=>{const A=S.active,last=A.log.pop();if(!last){toast('No completed sets to undo');return}const [ei,si]=last,x=A.exercises[ei];if(!x||!x.sets[si]){render();return}x.sets[si].done=false;x.feel=null;A.cur={ei,si};A.phase='set';A.restEnd=0;A.hold=A.emom=A.tempo=null;save();render();toast('Set reopened')},

    x.sets=x.sets.filter(s=>s.done);A.hold=A.emom=A.tempo=null;if(x.sets.length){A.phase='rate'}else{advance()}save();render()},
  swap:()=>{const {x}=curParts();if(!x){toast('Add an exercise first');return}swapSheet()},
  swapAny:()=>{closeSheet();openPick('swap')},
  doSwap:b=>doSwap(b.dataset.id),
  overview:()=>overviewSheet(),
  jump:b=>{const A=S.active,ei=+b.dataset.ei,x=A.exercises[ei],si=firstOpen(x);A.cur={ei,si:si>=0?si:0};A.phase=si>=0?'set':'rate';A.hold=A.emom=A.tempo=null;closeSheet();save();render()},
  addSet:b=>{const A=S.active,ei=+b.dataset.ei,x=A.exercises[ei],last=x.sets[x.sets.length-1]||{w:'',r:'',t:'',d:''};x.sets.push({w:last.w,r:x.rec?.r??last.r,t:last.t,d:last.d,done:false});
    if(A.phase==='checkin'||(A.phase==='rate'&&A.cur.ei===ei)){A.cur={ei,si:firstOpen(x)};A.phase='set'}save();overviewSheet();render()},
  delEx:async b=>{const A=S.active,ei=+b.dataset.ei;if(!await ask({title:`Remove ${exName(A.exercises[ei].exId)}?`,msg:'Its sets in this workout will be removed.',ok:'Remove',danger:true}))return;
    A.exercises.splice(ei,1);A.log=A.log.filter(([e])=>e!==ei).map(([e,s])=>[e>ei?e-1:e,s]);A.hold=A.emom=A.tempo=null;
    if(!A.exercises.length){A.cur={ei:0,si:0};A.phase='set'}else{if(A.cur.ei>ei)A.cur.ei--;if(A.cur.ei>=A.exercises.length)A.cur.ei=A.exercises.length-1;const si=firstOpen(A.exercises[A.cur.ei]);if(si>=0){A.cur.si=si;if(A.phase!=='rest')A.phase='set'}else{advance()}}
    save();render()},
  addEx:()=>openPick('workout'),
  closePick,closeSheet,
  pick:b=>picked(b.dataset.id),
  pickNew:()=>{const name=$('#pickSearch').value.trim();if(!name)return;qc={name,type:'weight',min:8,max:12,target:10,muscle:'Other',equip:'other'};renderQC();$('#qc-name').focus()},
  qcType:b=>{qc.type=b.dataset.v;qc.target=qcDefaults(qc.type).target;qc.equip=qc.type==='reps'||qc.type==='time'?(qc.equip==='other'?'bodyweight':qc.equip):qc.equip;renderQC()},
  qcBack:()=>{const n=qc?.name||'';qc=null;openPick(pickMode);$('#pickSearch').value=n;renderPick()},
  qcCreate:()=>{const name=qc.name.trim();if(!name){toast('Give the exercise a name');return}
    if(S.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase())){toast('That name is already in the list. Pick it from the search instead.');return}
    const e=customEx(name,qc.muscle,S.unit,qc.type);e.equip=qc.equip;
    if(qc.type==='weight'){let a=Math.max(1,Math.round(+qc.min||8)),b=Math.max(1,Math.round(+qc.max||12));if(b<a)[a,b]=[b,a];e.repMin=a;e.repMax=b}else e.target=Math.max(1,Math.round(+qc.target||qcDefaults(qc.type).target));
    S.exercises.push(e);save();qc=null;picked(e.id);toast(`${name} created`)},
  newRoutine:()=>{draft={id:null,name:'',items:[]};openItem={ctx:null,i:-1};routineSheet()},
  editRoutine:b=>{const r=S.routines.find(r=>r.id===b.dataset.id);if(!r)return;draft={id:r.id,name:r.name,items:r.items.map(i=>({...i}))};openItem={ctx:null,i:-1};routineSheet()},
  rAdd:()=>openPick('routine'),
  rSave:()=>{const name=($('#r-name')?.value??draft.name).trim();if(!name){toast('Give the routine a name');return}if(!draft.items.length){toast('Add at least one exercise');return}
    if(draft.id){const r=S.routines.find(r=>r.id===draft.id);Object.assign(r,{name,items:draft.items,sample:false})}else{const r={id:uid(),name,items:draft.items};S.routines.push(r);view.preview=r.id}
    save();closeSheet();tab='workout';render();toast('Routine saved')},
  rDelete:async()=>{const id=draft.id,r=S.routines.find(r=>r.id===id);if(await ask({title:`Delete “${r.name}”?`,msg:'Your workout history stays as it is.',ok:'Delete routine',danger:true})){S.routines=S.routines.filter(x=>x.id!==id);view.preview=null;save();render();toast('Routine deleted')}},
  saveRoutine:async b=>{const w=S.workouts.find(w=>w.id===b.dataset.id);if(!w)return;const name=await ask({title:'Name this routine',ok:'Save routine',input:w.name});if(!name||!name.trim())return;S.routines.push({id:uid(),name:name.trim(),items:w.exercises.map(x=>({exId:x.exId,sets:x.sets.length}))});save();toast('Routine saved to the Workout tab')},
  delWorkout:async b=>{if(await ask({title:'Delete this workout?',msg:'It will be removed from your history and records.',ok:'Delete',danger:true})){S.workouts=S.workouts.filter(w=>w.id!==b.dataset.id);save();render();toast('Workout deleted')}},
  exOpen:b=>exSheet(b.dataset.id),
  newExercise:()=>exSheet(null),
  saveEx:b=>{const id=b.dataset.id,name=$('#e-name').value.trim();if(!name){toast('Enter a name');return}
    if(S.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase()&&e.id!==id)){toast('That name is already in the list');return}
    const num=(sel,def,min)=>{const v=parseFloat($(sel).value);return isFinite(v)&&v>=min?v:def};
    let mn=Math.round(num('#e-min',8,1)),mx=Math.round(num('#e-max',12,1));if(mx<mn)[mn,mx]=[mx,mn];
    const tv=$('#e-tempo').value.trim(),tempo=parseTempo(tv);if(tv&&!tempo){toast('Write tempo as three numbers, like 3-0-1');return}
    const vals={name,muscle:$('#e-muscle').value.trim()||'Other',equip:$('#e-equip').value,type:$('#e-type').value,repMin:mn,repMax:mx,inc:num('#e-inc',5,0),target:Math.round(num('#e-target',30,1)),step:Math.round(num('#e-step',5,1)),interval:Math.round(num('#e-interval',60,10)),rest:Math.round(num('#e-rest',90,0)),tempo};
    if(id)Object.assign(exById(id),vals);else S.exercises.push({id:uid(),pattern:'',...vals});
    save();closeSheet();render();toast('Exercise saved')},
  delExercise:async b=>{if(await ask({title:'Delete this exercise?',ok:'Delete',danger:true})){S.exercises=S.exercises.filter(e=>e.id!==b.dataset.id);save();render()}},
  voice:()=>{S.voice=!S.voice;save();render();if(S.voice)speak('Voice coach on.')},
  mic:()=>{audioUnlock();listening?(stopListening(),toast('Voice commands off')):startListening()},
  itOpen:b=>{const ctx=b.dataset.ctx,i=+b.dataset.i;openItem=openItem.ctx===ctx&&openItem.i===i?{ctx:null,i:-1}:{ctx,i};ctxRefresh(ctx)},
  itMove:b=>{const ctx=b.dataset.ctx,i=+b.dataset.i,j=i+ +b.dataset.d,l=ctxList(ctx);if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];if(openItem.ctx===ctx&&openItem.i===i)openItem.i=j;ctxRefresh(ctx)},
  itDel:b=>{const ctx=b.dataset.ctx,i=+b.dataset.i;ctxList(ctx).splice(i,1);openItem={ctx:null,i:-1};ctxRefresh(ctx)},
  itSets:b=>{const ctx=b.dataset.ctx,it=ctxList(ctx)[+b.dataset.i],max=exById(it.exId)?.type==='emom'?30:10;it.sets=Math.max(1,Math.min(max,it.sets+ +b.dataset.d));
    const n=$(`#sets-${ctx}-${b.dataset.i}`);if(n)n.textContent=it.sets;const sm=$(`#sum-${ctx}-${b.dataset.i}`);if(sm)sm.textContent=itemSummary(it)},
  itReset:b=>{const ctx=b.dataset.ctx,l=ctxList(ctx),i=+b.dataset.i;l[i]={exId:l[i].exId,sets:l[i].sets};ctxRefresh(ctx);toast('Using the exercise defaults')},
  itSwap:b=>{const ctx=b.dataset.ctx,i=+b.dataset.i,list=ctxList(ctx),ex=exById(list[i].exId);itemTarget={ctx,i};const c=swapCandidates(ex,new Set(list.map(x=>x.exId)));
    openSheet(`<div class="row"><h3 class="grow">Swap ${esc(ex.name)}</h3></div><p class="muted">Equivalent exercises with your equipment. Same movement first.</p>
      ${c.length?`<div class="list">${c.map(e=>`<button class="item" data-a="itSwapTo" data-id="${e.id}"><span><strong>${esc(e.name)}</strong><br><span class="muted">${esc(e.equip)} · ${esc(TYPES[e.type])}</span></span><span class="muted">${e.pattern===ex.pattern?'Same movement':esc(e.muscle)}</span></button>`).join('')}</div>`:'<p>No equivalent with your equipment.</p>'}
      <button class="btn block" data-a="itSwapAny">Choose any exercise</button><button class="btn block ghost" data-a="itSwapCancel">Cancel</button>`)},
  itSwapTo:b=>applyItemSwap(b.dataset.id),
  itSwapAny:()=>openPick('itemSwap'),
  itSwapCancel:()=>{if(itemTarget.ctx==='r')routineSheet();else closeSheet()},
  blockW:b=>{const v=+b.dataset.v;S.blockWeeks=v;S.blockStart=v?(S.blockStart||Date.now()):0;save();render()},
  dayT:b=>{const i=+b.dataset.v;S.days=S.days.includes(i)?S.days.filter(d=>d!==i):[...S.days,i].sort((a,b)=>a-b);save();render()},
  newProfile:()=>{pdraft={id:null,name:'',equip:['bodyweight','other']};profileSheet()},
  editProfile:b=>{const p=S.profiles.find(p=>p.id===b.dataset.id);pdraft={id:p.id,name:p.name,equip:[...p.equip]};profileSheet()},
  pEq:b=>{const q=b.dataset.v;pdraft.equip=pdraft.equip.includes(q)?pdraft.equip.filter(x=>x!==q):[...pdraft.equip,q];profileSheet()},
  pSave:()=>{const name=$('#p-name').value.trim();if(!name){toast('Give the profile a name');return}
    if(pdraft.id)Object.assign(S.profiles.find(p=>p.id===pdraft.id),{name,equip:pdraft.equip});else{pdraft.id=uid();S.profiles.push({id:pdraft.id,name,equip:pdraft.equip})}
    S.profileId=pdraft.id;save();closeSheet();render();toast(`Training at ${name}`)},
  pDel:async()=>{const id=pdraft.id;if(await ask({title:'Delete this profile?',ok:'Delete',danger:true})){S.profiles=S.profiles.filter(p=>p.id!==id);if(S.profileId===id)S.profileId=S.profiles[0].id;save();render()}},
  plates:()=>{const {ex,s}=S.active?curParts():{};plateSheet(ex&&ex.equip==='barbell'?+s?.w:0)},
  plToggle:b=>{const U=S.unit,v=+b.dataset.v;S.plates[U]=S.plates[U].includes(v)?S.plates[U].filter(p=>p!==v):[...S.plates[U],v];save();plateSheet(+$('#pl-target').value);if(S.active)render()},
  startDeload:()=>{S.deloadUntil=Date.now()+7*864e5;if(S.blockWeeks)S.blockStart=S.deloadUntil;save();render();toast(`Deload week until ${fmtDate(S.deloadUntil)}`)},
  endDeload:()=>{S.deloadUntil=0;if(S.blockWeeks)S.blockStart=Date.now();S.deloadSnooze=Date.now()+7*864e5;save();render();toast('Deload ended. Normal progression is back.')},
  snoozeDeload:()=>{S.deloadSnooze=Date.now()+7*864e5;save();render()},
  export:()=>openSheet(`<h3>Copy backup</h3><p class="muted">Save this text in your notes or email it to yourself. Paste it into Restore backup on any device to bring your log back.</p>
    <textarea id="bk" readonly rows="7" aria-label="Backup text">${esc(JSON.stringify(S))}</textarea>
    <div class="row"><button class="btn grow" data-a="closeSheet">Close</button><button class="btn primary grow" data-a="copyBk">Copy to clipboard</button></div>`),
  copyBk:()=>{const t=$('#bk');const fb=()=>{t.focus();t.select();toast('Text selected. Long-press or use your keyboard to copy.')};try{navigator.clipboard.writeText(t.value).then(()=>toast('Backup copied'),fb)}catch(e){fb()}},
  import:()=>openSheet(`<h3>Restore backup</h3><p class="muted">Paste your backup text, or choose a backup file. This replaces everything on this device.</p>
    <textarea id="rs" rows="6" placeholder="Paste backup text here" aria-label="Backup text to restore"></textarea>
    <div class="row"><button class="btn grow" data-a="pickFile">Choose file</button><button class="btn primary grow" data-a="restore">Restore</button></div>
    <button class="btn block" data-a="closeSheet">Cancel</button>`),
  pickFile:()=>$('#importFile').click(),
  restore:()=>{let d=null;try{d=normalize(JSON.parse($('#rs').value))}catch(e){}if(!d){toast("That isn't a LiftLog backup. Check that you pasted all of it.");return}S=d;view={preview:null,summary:null,limit:null};save();closeSheet();tab='history';render();toast(`Restored ${S.workouts.length} workouts`)},
  reset:async()=>{if(await ask({title:'Erase all data?',msg:'Every workout, routine and custom exercise on this device will be deleted. This cannot be undone.',ok:'Erase everything',danger:true})){S=fresh(false);view={preview:null,summary:null,limit:null};save();wake(false);stopListening();setup=newSetup(0);render();toast('All data erased')}}
};
function doSwap(toId){
  const {A,x,ex}=curParts(),to=exById(toId);if(!to)return;
  const remaining=x.sets.filter(s=>!s.done).length||x.sets.length,n=to.type==='emom'?Math.max(remaining,5):remaining;
  const entry=makeEntry(toId,deloadAdj(swapRec(ex,to,curWeight(),n),to),`Swapped from ${ex.name}`);
  const doneSets=x.sets.filter(s=>s.done);
  if(doneSets.length){x.sets=doneSets;x.feel=x.feel||'good';A.exercises.splice(A.cur.ei+1,0,entry);A.log=A.log.map(([e,s])=>[e>A.cur.ei?e+1:e,s]);A.cur={ei:A.cur.ei+1,si:0}}
  else{A.exercises[A.cur.ei]=entry;A.log=A.log.filter(([e])=>e!==A.cur.ei);A.cur.si=0}
  A.phase='set';A.hold=A.emom=A.tempo=null;closeSheet();save();render();toast(`Swapped to ${to.name}`);
}
function picked(exId){
  closePick();
  if(pickMode==='routine'){draft.items.push({exId,sets:exById(exId)?.type==='emom'?10:3});routineSheet();return}
  if(pickMode==='swap'){doSwap(exId);return}
  if(pickMode==='itemSwap'){applyItemSwap(exId);return}
  if(pickMode==='setup'){const {di,ii}=setupTarget;const ex=exById(exId);if(ii==null)setup.plan[di].items.push({exId,sets:ex?.type==='emom'?10:3});else setup.plan[di].items[ii].exId=exId;render();return}
  const A=S.active,ex=exById(exId),prevN=exHistory(exId)[0]?.sets.length||(ex.type==='emom'?10:3);A.exercises.push(makeEntry(exId,deloadAdj(recommend(ex,prevN),ex)));
  const ei=A.exercises.length-1,cur=A.exercises[A.cur.ei];
  if(!cur||firstOpen(cur)<0||A.phase==='checkin'||A.exercises.length===1){A.cur={ei,si:0};if(A.phase!=='rest')A.phase='set'}
  save();if(sheetRender===overviewSheet)overviewSheet();render();
}
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closePick();return}
  if(e.target.id==='dialog'){closeSheet();return}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=act[b.dataset.a]||suAct[b.dataset.a];if(f)f(b);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.cf&&S.active){const {ex,s}=curParts();if(s){s[t.dataset.cf]=t.value;save();const d=$('#doneBtn');if(d)d.textContent=doneLabel(ex,s);const pl=$('#plateLine');if(pl)pl.textContent=plateLine(+s.w||0)}}
  else if(t.dataset.day!=null&&setup?.plan){setup.plan[+t.dataset.day].name=t.value}
  else if(t.id==='r-name'&&draft){draft.name=t.value}
  else if(t.dataset.rf){const ctx=t.dataset.ctx,i=+t.dataset.i,it=ctxList(ctx)[i],k=t.dataset.rf,v=t.value.trim();
    if(k==='note'){if(v)it.note=v;else delete it.note}
    else if(k==='tempo'){const tp=parseTempo(v);if(!v)delete it.tempo;else if(tp)it.tempo=tp}
    else{const n=parseFloat(v);if(v===''||!isFinite(n)||n<0)delete it[k];else it[k]=k==='w'?Math.round(n*100)/100:Math.max(k==='rest'?0:1,Math.round(n))}
    const sm=$(`#sum-${ctx}-${i}`);if(sm)sm.textContent=itemSummary(it)}
  else if(qc&&t.id&&t.id.startsWith('qc-')){const k={'qc-name':'name','qc-min':'min','qc-max':'max','qc-target':'target'}[t.id];if(k)qc[k]=t.value}
  else if(t.id==='exSearch')renderExList();
  else if(t.id==='pickSearch')renderPick();
  else if(t.id==='pl-target')renderPlates();
  else if(t.id==='pl-bar'){const v=parseFloat(t.value);if(isFinite(v)&&v>=0){S.bar[S.unit]=v;save();renderPlates()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='unit'){S.unit=t.value;save();render()}
  else if(t.id==='profileSel'){S.profileId=t.value;save();render();toast(`Training at ${profile().name}`)}
  else if(t.id==='e-type')syncTypeFields();
  else if(qc&&(t.id==='qc-muscle'||t.id==='qc-equip'))qc[t.id.slice(3)]=t.value;
  else if(t.id==='importFile'&&t.files[0]){const f=t.files[0];t.value='';f.text().then(txt=>{const r=$('#rs');if(r)r.value=txt;toast('File loaded. Tap Restore.')}).catch(()=>toast("Couldn't read that file"))}
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#modal').hidden)closePick();else if(!$('#dialog').hidden)closeSheet()});
if(!S.setupDone)setup=newSetup(0);
if(S.active)wake(true);
render();
</script>

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
